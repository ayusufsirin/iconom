name: ${COMPOSE_PROJECT_NAME:-iconom}

services:
  px4:
    image: alpine:3.20
    command: ["sh", "-lc", "echo 'px4 scaffold only: PX4 SITL image/build not implemented yet'; sleep infinity"]
    environment:
      ICONOM_VEHICLE_NAMESPACE: ${ICONOM_VEHICLE_NAMESPACE:-plane_01}
      PX4_UXRCE_DDS_NS: ${PX4_UXRCE_DDS_NS:-plane_01}
      UXRCE_DDS_KEY: ${UXRCE_DDS_KEY:-1}
      XRCE_AGENT_UDP_PORT: ${XRCE_AGENT_UDP_PORT:-8888}
      MAVLINK_OFFBOARD_BASE_PORT: ${MAVLINK_OFFBOARD_BASE_PORT:-14540}
      MAVLINK_GCS_PORT: ${MAVLINK_GCS_PORT:-14550}
    restart: "no"

  gazebo:
    image: alpine:3.20
    command: ["sh", "-lc", "echo 'gazebo scaffold only: Gazebo Harmonic image/build not implemented yet'; sleep infinity"]
    environment:
      ICONOM_VEHICLE_NAMESPACE: ${ICONOM_VEHICLE_NAMESPACE:-plane_01}
      GAZEBO_WORLD: ${GAZEBO_WORLD:-empty}
    restart: "no"

  xrce_agent:
    image: alpine:3.20
    command: ["sh", "-lc", "echo 'xrce_agent scaffold only: MicroXRCEAgent image/build not implemented yet'; sleep infinity"]
    environment:
      XRCE_AGENT_UDP_PORT: ${XRCE_AGENT_UDP_PORT:-8888}
    restart: "no"

  ros2_app:
    image: alpine:3.20
    command: ["sh", "-lc", "echo 'ros2_app scaffold only: ROS 2 app image/build not implemented yet'; sleep infinity"]
    environment:
      ICONOM_VEHICLE_NAMESPACE: ${ICONOM_VEHICLE_NAMESPACE:-plane_01}
      PX4_UXRCE_DDS_NS: ${PX4_UXRCE_DDS_NS:-plane_01}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      USE_SIM_TIME: ${USE_SIM_TIME:-true}
      CAMERA_TOPIC: ${CAMERA_TOPIC:-/plane_01/camera/image_raw}
      PX4_TELEMETRY_TOPIC_PREFIX: ${PX4_TELEMETRY_TOPIC_PREFIX:-/plane_01/fmu/out}
    restart: "no"
