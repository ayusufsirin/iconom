name: ${COMPOSE_PROJECT_NAME:-iconom}

services:
  px4:
    build:
      context: .
      dockerfile: docker/px4/Dockerfile
      args:
        PX4_GIT_REF: ${PX4_GIT_REF:-v1.16.0}
    network_mode: "service:gazebo"
    environment:
      ICONOM_VEHICLE_NAMESPACE: ${ICONOM_VEHICLE_NAMESPACE:-plane_01}
      PX4_HEADLESS: ${PX4_HEADLESS:-1}
      PX4_SYS_AUTOSTART: ${PX4_SYS_AUTOSTART:-4003}
      PX4_GZ_WORLD: ${PX4_GZ_WORLD:-default}
      PX4_UXRCE_DDS_HOST: ${PX4_UXRCE_DDS_HOST:-xrce_agent}
      PX4_UXRCE_DDS_NS: ${PX4_UXRCE_DDS_NS:-plane_01}
      PX4_GIT_REF: ${PX4_GIT_REF:-v1.16.0}
      PX4_SIM_MODEL: ${PX4_SIM_MODEL:-gz_rc_cessna}
      PX4_INSTANCE: ${PX4_INSTANCE:-0}
      PX4_GZ_MODEL_POSE: ${PLANE_01_PX4_GZ_MODEL_POSE:-${PX4_GZ_MODEL_POSE:-0,0,0}}
      UXRCE_DDS_KEY: ${UXRCE_DDS_KEY:-1}
      XRCE_AGENT_UDP_PORT: ${XRCE_AGENT_UDP_PORT:-8888}
      MAVLINK_OFFBOARD_BASE_PORT: ${MAVLINK_OFFBOARD_BASE_PORT:-14540}
      MAVLINK_GCS_PORT: ${MAVLINK_GCS_PORT:-14550}
      ICONOM_GZ_MODEL_NAME: ${ICONOM_GZ_MODEL_NAME:-rc_cessna_0}
      ICONOM_EXPECTED_MAV_SYS_ID: ${ICONOM_EXPECTED_MAV_SYS_ID:-1}
      ICONOM_EXPECTED_MAVLINK_OFFBOARD_PORT: ${ICONOM_EXPECTED_MAVLINK_OFFBOARD_PORT:-14540}
      ICONOM_EXPECTED_UXRCE_DDS_KEY: ${ICONOM_EXPECTED_UXRCE_DDS_KEY:-1}
    depends_on:
      gazebo:
        condition: service_started
      xrce_agent:
        condition: service_started
    restart: "no"
    command: ["bash", "-lc", "echo 'px4 plane_01 slice ready; use /usr/local/bin/px4-run-single-vehicle.sh for the real one-vehicle bring-up path'; sleep infinity"]

  px4_plane_02:
    profiles: ["phase4"]
    build:
      context: .
      dockerfile: docker/px4/Dockerfile
      args:
        PX4_GIT_REF: ${PX4_GIT_REF:-v1.16.0}
    network_mode: "service:gazebo"
    environment:
      ICONOM_VEHICLE_NAMESPACE: ${PLANE_02_NAMESPACE:-plane_02}
      PX4_HEADLESS: ${PX4_HEADLESS:-1}
      PX4_SYS_AUTOSTART: ${PX4_SYS_AUTOSTART:-4003}
      PX4_GZ_WORLD: ${PX4_GZ_WORLD:-default}
      PX4_UXRCE_DDS_HOST: ${PX4_UXRCE_DDS_HOST:-xrce_agent}
      PX4_UXRCE_DDS_NS: ${PLANE_02_PX4_UXRCE_DDS_NS:-plane_02}
      PX4_GIT_REF: ${PX4_GIT_REF:-v1.16.0}
      PX4_SIM_MODEL: ${PX4_SIM_MODEL:-gz_rc_cessna}
      PX4_INSTANCE: ${PLANE_02_PX4_INSTANCE:-1}
      PX4_GZ_MODEL_POSE: ${PLANE_02_PX4_GZ_MODEL_POSE:-0,15,0}
      UXRCE_DDS_KEY: ${PLANE_02_UXRCE_DDS_KEY:-2}
      XRCE_AGENT_UDP_PORT: ${XRCE_AGENT_UDP_PORT:-8888}
      MAVLINK_OFFBOARD_BASE_PORT: ${MAVLINK_OFFBOARD_BASE_PORT:-14540}
      MAVLINK_GCS_PORT: ${MAVLINK_GCS_PORT:-14550}
      ICONOM_GZ_MODEL_NAME: ${PLANE_02_GZ_MODEL_NAME:-rc_cessna_1}
      ICONOM_EXPECTED_MAV_SYS_ID: ${PLANE_02_MAV_SYS_ID:-2}
      ICONOM_EXPECTED_MAVLINK_OFFBOARD_PORT: ${PLANE_02_MAVLINK_OFFBOARD_PORT:-14541}
      ICONOM_EXPECTED_UXRCE_DDS_KEY: ${PLANE_02_EXPECTED_UXRCE_DDS_KEY:-2}
    depends_on:
      gazebo:
        condition: service_started
      xrce_agent:
        condition: service_started
    restart: "no"
    command: ["bash", "-lc", "echo 'px4 plane_02 phase-4 contract ready; use /usr/local/bin/px4-run-vehicle.sh for future dual-aircraft bring-up work'; sleep infinity"]

  gazebo:
    build:
      context: .
      dockerfile: docker/gazebo/Dockerfile
      args:
        PX4_GIT_REF: ${PX4_GIT_REF:-v1.16.0}
    environment:
      ICONOM_VEHICLE_NAMESPACE: ${ICONOM_VEHICLE_NAMESPACE:-plane_01}
      ROS_DISTRO: ${ROS_DISTRO:-humble}
      USE_SIM_TIME: ${USE_SIM_TIME:-true}
      GZ_SIM_RESOURCE_PATH: ${GZ_SIM_RESOURCE_PATH:-/opt/iconom/sim:/opt/PX4-Autopilot/Tools/simulation/gz/models:/opt/PX4-Autopilot/Tools/simulation/gz/worlds}
      GZ_SIM_SERVER_CONFIG_PATH: ${GZ_SIM_SERVER_CONFIG_PATH:-/opt/iconom/sim/server.config}
      GAZEBO_WORLD_FILE: ${GAZEBO_WORLD_FILE:-/opt/PX4-Autopilot/Tools/simulation/gz/worlds/default.sdf}
    working_dir: /opt/iconom/sim
    volumes:
      - ./sim:/opt/iconom/sim:ro
    command: ["bash", "-lc", "gz sim -s --headless-rendering -r \"${GAZEBO_WORLD_FILE}\""]
    restart: "no"

  xrce_agent:
    build:
      context: .
      dockerfile: docker/xrce_agent/Dockerfile
      args:
        XRCE_AGENT_VERSION: ${XRCE_AGENT_VERSION:-v2.4.3}
    environment:
      XRCE_AGENT_UDP_PORT: ${XRCE_AGENT_UDP_PORT:-8888}
    ports:
      - "${XRCE_AGENT_UDP_PORT:-8888}:${XRCE_AGENT_UDP_PORT:-8888}/udp"
    restart: "no"

  referee_server:
    profiles: ["phase5"]
    image: python:3.11-slim
    ports:
      - "${REFERE_SERVER_PORT:-45678}:45678"
    volumes:
      - ./sim/referee_server:/app
    working_dir: /app
    command: ["python3", "-c", "from http.server import HTTPServer; from referee_server import RefereeHandler; HTTPServer(('0.0.0.0', 45678), RefereeHandler).serve_forever()"]
    restart: "no"

  ros2_app:
    build:
      context: .
      dockerfile: docker/ros2_app/Dockerfile
    environment:
      ICONOM_VEHICLE_NAMESPACE: ${ICONOM_VEHICLE_NAMESPACE:-plane_01}
      PX4_UXRCE_DDS_NS: ${PX4_UXRCE_DDS_NS:-plane_01}
      ROS_DISTRO: ${ROS_DISTRO:-humble}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      USE_SIM_TIME: ${USE_SIM_TIME:-true}
      CAMERA_TOPIC: ${CAMERA_TOPIC:-/plane_01/camera/image_raw}
      CAMERA_INFO_TOPIC: ${CAMERA_INFO_TOPIC:-/plane_01/camera/camera_info}
      PX4_TELEMETRY_TOPIC: ${PX4_TELEMETRY_TOPIC:-/plane_01/fmu/out/vehicle_status_v1}
      PX4_TELEMETRY_TOPIC_PREFIX: ${PX4_TELEMETRY_TOPIC_PREFIX:-/plane_01/fmu/out}
      PX4_COMMAND_TOPIC: ${PX4_COMMAND_TOPIC:-/plane_01/fmu/in/vehicle_command}
      PX4_COMMAND_ACK_TOPIC: ${PX4_COMMAND_ACK_TOPIC:-/plane_01/fmu/out/vehicle_command_ack}
    depends_on:
      xrce_agent:
        condition: service_started
    working_dir: /workspaces/ros2_ws
    volumes:
      - ./ros2_ws:/workspaces/ros2_ws
    command: ["bash", "-lc", "echo 'ros2_app base workspace ready; no project packages are implemented yet'; sleep infinity"]
    restart: "no"

  ros_gz_bridge:
    build:
      context: .
      dockerfile: docker/ros_gz_bridge/Dockerfile
    network_mode: "service:gazebo"
    environment:
      ROS_DISTRO: ${ROS_DISTRO:-humble}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      USE_SIM_TIME: ${USE_SIM_TIME:-true}
      GZ_IMAGE_TOPIC: ${GZ_IMAGE_TOPIC:-/world/default/model/rc_cessna_0/link/camera_link/sensor/imager/image}
      GZ_CAMERA_INFO_TOPIC: ${GZ_CAMERA_INFO_TOPIC:-/world/default/model/rc_cessna_0/link/camera_link/sensor/imager/camera_info}
      CAMERA_TOPIC: ${CAMERA_TOPIC:-/plane_01/camera/image_raw}
      CAMERA_INFO_TOPIC: ${CAMERA_INFO_TOPIC:-/plane_01/camera/camera_info}
    depends_on:
      gazebo:
        condition: service_started
    command: ["/usr/local/bin/ros-gz-bridge-entrypoint.sh"]
    restart: "no"

  ros_gz_bridge_plane_02:
    profiles: ["phase4"]
    build:
      context: .
      dockerfile: docker/ros_gz_bridge/Dockerfile
    network_mode: "service:gazebo"
    environment:
      ROS_DISTRO: ${ROS_DISTRO:-humble}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      USE_SIM_TIME: ${USE_SIM_TIME:-true}
      GZ_IMAGE_TOPIC: ${PLANE_02_GZ_IMAGE_TOPIC:-/world/default/model/rc_cessna_1/link/camera_link/sensor/imager/image}
      GZ_CAMERA_INFO_TOPIC: ${PLANE_02_GZ_CAMERA_INFO_TOPIC:-/world/default/model/rc_cessna_1/link/camera_link/sensor/imager/camera_info}
      CAMERA_TOPIC: ${PLANE_02_CAMERA_TOPIC:-/plane_02/camera/image_raw}
      CAMERA_INFO_TOPIC: ${PLANE_02_CAMERA_INFO_TOPIC:-/plane_02/camera/camera_info}
    depends_on:
      gazebo:
        condition: service_started
    command: ["/usr/local/bin/ros-gz-bridge-entrypoint.sh"]
    restart: "no"
