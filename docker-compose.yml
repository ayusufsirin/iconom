name: ${COMPOSE_PROJECT_NAME:-iconom}

services:
  px4:
    build:
      context: .
      dockerfile: docker/px4/Dockerfile
      args:
        PX4_GIT_REF: ${PX4_GIT_REF:-v1.16.0}
    environment:
      ICONOM_VEHICLE_NAMESPACE: ${ICONOM_VEHICLE_NAMESPACE:-plane_01}
      PX4_UXRCE_DDS_NS: ${PX4_UXRCE_DDS_NS:-plane_01}
      PX4_GIT_REF: ${PX4_GIT_REF:-v1.16.0}
      PX4_SIM_MODEL: ${PX4_SIM_MODEL:-gz_rc_cessna}
      UXRCE_DDS_KEY: ${UXRCE_DDS_KEY:-1}
      XRCE_AGENT_UDP_PORT: ${XRCE_AGENT_UDP_PORT:-8888}
      MAVLINK_OFFBOARD_BASE_PORT: ${MAVLINK_OFFBOARD_BASE_PORT:-14540}
      MAVLINK_GCS_PORT: ${MAVLINK_GCS_PORT:-14550}
    restart: "no"

  gazebo:
    build:
      context: .
      dockerfile: docker/gazebo/Dockerfile
    environment:
      ICONOM_VEHICLE_NAMESPACE: ${ICONOM_VEHICLE_NAMESPACE:-plane_01}
      ROS_DISTRO: ${ROS_DISTRO:-humble}
      USE_SIM_TIME: ${USE_SIM_TIME:-true}
      GZ_SIM_RESOURCE_PATH: ${GZ_SIM_RESOURCE_PATH:-/opt/iconom/sim}
      GAZEBO_WORLD_FILE: ${GAZEBO_WORLD_FILE:-/opt/iconom/sim/worlds/empty.sdf}
    working_dir: /opt/iconom/sim
    volumes:
      - ./sim:/opt/iconom/sim:ro
    command: ["bash", "-lc", "gz sim -s -r \"${GAZEBO_WORLD_FILE}\""]
    restart: "no"

  xrce_agent:
    build:
      context: .
      dockerfile: docker/xrce_agent/Dockerfile
      args:
        XRCE_AGENT_VERSION: ${XRCE_AGENT_VERSION:-v2.4.3}
    environment:
      XRCE_AGENT_UDP_PORT: ${XRCE_AGENT_UDP_PORT:-8888}
    ports:
      - "${XRCE_AGENT_UDP_PORT:-8888}:${XRCE_AGENT_UDP_PORT:-8888}/udp"
    restart: "no"

  ros2_app:
    build:
      context: .
      dockerfile: docker/ros2_app/Dockerfile
    environment:
      ICONOM_VEHICLE_NAMESPACE: ${ICONOM_VEHICLE_NAMESPACE:-plane_01}
      PX4_UXRCE_DDS_NS: ${PX4_UXRCE_DDS_NS:-plane_01}
      ROS_DISTRO: ${ROS_DISTRO:-humble}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      USE_SIM_TIME: ${USE_SIM_TIME:-true}
      CAMERA_TOPIC: ${CAMERA_TOPIC:-/plane_01/camera/image_raw}
      PX4_TELEMETRY_TOPIC_PREFIX: ${PX4_TELEMETRY_TOPIC_PREFIX:-/plane_01/fmu/out}
    working_dir: /workspaces/ros2_ws
    volumes:
      - ./ros2_ws:/workspaces/ros2_ws
    command: ["bash", "-lc", "echo 'ros2_app base workspace ready; no project packages are implemented yet'; sleep infinity"]
    restart: "no"
