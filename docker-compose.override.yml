services:
  px4:
    stdin_open: true
    tty: true

  gazebo:
    stdin_open: true
    tty: true
    command: ["bash", "-lc", "gz sim -r \"${GAZEBO_WORLD_FILE}\""]
    environment:
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

  ros2_app:
    stdin_open: true
    tty: true
    volumes:
      - ./ros2_ws:/workspaces/ros2_ws

  dev_tools:
    image: alpine:3.20
    command: ["sh", "-lc", "echo 'local dev scaffold only'; sleep infinity"]
    profiles: ["dev"]
    restart: "no"

# This file is for local host execution extras only.
# It extends the canonical stack from docker-compose.yml rather than defining a separate stack.
# GUI and display handling belong here rather than in the canonical headless stack.
